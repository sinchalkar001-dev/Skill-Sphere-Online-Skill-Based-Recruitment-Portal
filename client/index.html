<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Skill Sphere</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container { max-width: 1100px; margin: 0 auto; }

      header {
        text-align: center;
        color: white;
        margin-bottom: 40px;
        animation: fadeInDown 0.6s ease;
      }

      h1 {
        font-size: 2.5em;
        margin-bottom: 8px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
      }

      .tagline {
        font-size: 1.1em;
        opacity: 0.95;
      }

      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
      
      @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

      .card { 
        background: white; 
        border-radius: 12px; 
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        animation: fadeInUp 0.6s ease;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.3); }

      .card h2 {
        color: #667eea;
        margin-bottom: 16px;
        font-size: 1.5em;
        border-bottom: 2px solid #667eea;
        padding-bottom: 10px;
      }

      .card.full { grid-column: 1 / -1; }

      .form-group { margin-bottom: 14px; }

      label { 
        display: block; 
        font-weight: 600; 
        color: #333;
        margin-bottom: 6px;
        font-size: 0.95em;
      }

      input, textarea, select { 
        width: 100%; 
        padding: 12px; 
        margin: 0;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1em;
        font-family: inherit;
        transition: border-color 0.3s;
      }

      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      textarea { resize: vertical; min-height: 100px; }

      .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      
      @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

      button {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-primary:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }

      .btn-secondary {
        background: #f0f0f0;
        color: #333;
        border: 2px solid #667eea;
      }

      .btn-secondary:hover { background: #667eea; color: white; }

      .btn-small { padding: 8px 16px; font-size: 0.9em; }

      .btn-success { background: #10b981; color: white; }
      .btn-success:hover { box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4); }

      .btn-danger { background: #ef4444; color: white; }
      .btn-danger:hover { box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4); }

      .user-info {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 16px;
        border-radius: 8px;
        margin-top: 16px;
        font-weight: 500;
        text-align: center;
      }

      #jobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

      .job-card {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        border-radius: 10px;
        padding: 18px;
        cursor: pointer;
        transition: all 0.3s;
        border-left: 4px solid #667eea;
      }

      .job-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }

      .job-card b { color: #667eea; font-size: 1.1em; display: block; margin-bottom: 10px; }

      .job-desc { color: #555; font-size: 0.95em; margin: 8px 0; line-height: 1.4; }

      .job-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

      .tag {
        background: #667eea;
        color: white;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.8em;
      }

      .alert {
        padding: 14px;
        border-radius: 8px;
        margin-bottom: 16px;
        animation: slideIn 0.4s ease;
      }

      .alert-success { background: #d1fae5; color: #065f46; border-left: 4px solid #10b981; }
      .alert-error { background: #fee2e2; color: #991b1b; border-left: 4px solid #ef4444; }
      .alert-info { background: #dbeafe; color: #1e40af; border-left: 4px solid #3b82f6; }

      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #f3f3f3;
        border-top: 2px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 1000;
        justify-content: center;
        align-items: center;
      }

      .modal.active { display: flex; animation: fadeInDown 0.3s ease; }

      .modal-content {
        background: white;
        padding: 30px;
        border-radius: 12px;
        max-width: 500px;
        width: 90%;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      }

      .modal-content h2 { margin-bottom: 20px; }

      .close-btn {
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        color: #aaa;
      }

      .close-btn:hover { color: #000; }

      .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

      .section-title {
        color: white;
        font-size: 1.8em;
        margin: 30px 0 20px 0;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
      }

      .no-jobs { text-align: center; color: #999; padding: 40px 20px; font-size: 1.1em; }
    </style>
    <script src="https://cdn.socket.io/4.7.1/socket.io.min.js"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🚀 Skill Sphere</h1>
        <p class="tagline">Project-Based Recruitment Portal</p>
      </header>

      <div id="alerts"></div>

      <div class="grid">
        <section class="card">
          <h2>Authentication</h2>
          <div id="authForm">
            <div class="form-group">
              <label>Full Name</label>
              <input id="name" placeholder="Enter your name" />
            </div>
            <div class="form-group">
              <label>Email</label>
              <input id="email" placeholder="your@email.com" type="email" />
            </div>
            <div class="form-group">
              <label>Password</label>
              <input id="password" placeholder="••••••••" type="password" />
            </div>
            <div class="form-group">
              <label>Role</label>
              <select id="role">
                <option value="candidate">Candidate</option>
                <option value="recruiter">Recruiter</option>
              </select>
            </div>
            <div class="btn-group">
              <button class="btn-primary" id="register">Register</button>
              <button class="btn-secondary" id="login">Login</button>
            </div>
          </div>
          <div id="userInfo"></div>
        </section>

        <section class="card">
          <h2>Quick Info</h2>
          <div style="padding: 20px; text-align: center;">
            <div style="font-size: 1.2em; color: #667eea; margin-bottom: 16px;">
              <div id="jobCount">0</div>
              <small>Total Jobs</small>
            </div>
            <div style="font-size: 1.2em; color: #764ba2;">
              <div id="appCount">0</div>
              <small>My Applications</small>
            </div>
          </div>
        </section>
      </div>

      <section class="card card.full" id="postJob" style="display: none;">
        <h2>📝 Post New Job</h2>
        <div class="form-group">
          <label>Job Title</label>
          <input id="jobTitle" placeholder="e.g., Senior React Developer" />
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="jobDesc" placeholder="Describe the role, responsibilities..."></textarea>
        </div>
        <div class="form-group">
          <label>Requirements</label>
          <textarea id="jobReq" placeholder="List key requirements..."></textarea>
        </div>
        <div class="form-group">
          <label>Tech Tags (comma separated)</label>
          <input id="jobTags" placeholder="React, Node.js, PostgreSQL, etc." />
        </div>
        <button class="btn-primary" id="createJob">Post Job</button>
      </section>

      <div class="section-title">Available Opportunities</div>
      <section class="card card.full">
        <div id="jobs" class="no-jobs">Loading jobs...</div>
      </section>

      <section class="card card.full" id="apply" style="display: none;">
        <h2>💼 Apply for Job</h2>
        <div class="form-group">
          <label>Job ID</label>
          <input id="applyJobId" placeholder="Enter job ID" />
        </div>
        <div class="form-group">
          <label>Cover Letter</label>
          <textarea id="coverLetter" placeholder="Tell us why you're a great fit for this role..."></textarea>
        </div>
        <div class="form-group">
          <label>Project Links (JSON array)</label>
          <input id="projectLinks" placeholder='["https://github.com/project1", "https://project2.com"]' />
        </div>
        <div class="form-group">
          <label>Tech Tags (comma separated)</label>
          <input id="applyTags" placeholder="React, JavaScript, CSS, etc." />
        </div>
        <button class="btn-primary" id="submitApplication">Submit Application</button>
      </section>
    </div>

    <!-- Application Modal -->
    <div id="appModal" class="modal">
      <div class="modal-content">
        <span class="close-btn" id="closeAppModal">&times;</span>
        <h2>Apply for This Position</h2>
        <form id="appForm">
          <div class="form-group">
            <label>Cover Letter</label>
            <textarea id="appCoverLetter" placeholder="Why should we hire you?" required></textarea>
          </div>
          <div class="form-group">
            <label>Project Links (JSON array)</label>
            <input id="appProjects" placeholder='["url1", "url2"]' />
          </div>
          <div class="form-group">
            <label>Tech Tags (comma separated)</label>
            <input id="appTechTags" />
          </div>
          <button type="submit" class="btn-primary">Submit Application</button>
        </form>
      </div>
    </div>

    <!-- Recruiter Dashboard Modal -->
    <div id="dashModal" class="modal">
      <div class="modal-content">
        <span class="close-btn" id="closeDashModal">&times;</span>
        <h2>Applications Dashboard</h2>
        <div id="dashContent"></div>
      </div>
    </div>

    <script>
      const API = 'http://localhost:4000';
      const socket = (typeof io !== 'undefined') ? io(API) : null;
      let token = localStorage.getItem('ss_token') || null;
      let currentUser = JSON.parse(localStorage.getItem('ss_user') || 'null');
      let allJobs = [];
      let selectedJobId = null;

      function showAlert(message, type = 'info') {
        const alertsContainer = document.getElementById('alerts');
        const alert = document.createElement('div');
        alert.className = `alert alert-${type}`;
        alert.textContent = message;
        alertsContainer.appendChild(alert);
        setTimeout(() => alert.remove(), 4000);
      }

      function updateUI() {
        if (currentUser) {
          document.getElementById('authForm').style.display = 'none';
          document.getElementById('userInfo').innerHTML = `
            <div class="user-info">
              👤 ${currentUser.name}<br>
              ${currentUser.role === 'recruiter' ? '👔' : '💼'} ${currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1)}
              <button class="btn-secondary btn-small" style="margin-top: 12px; width: 100%;" onclick="logout()">Logout</button>
            </div>
          `;
          document.getElementById('postJob').style.display = currentUser.role === 'recruiter' ? 'block' : 'none';
          document.getElementById('apply').style.display = currentUser.role === 'candidate' ? 'block' : 'none';
        } else {
          document.getElementById('authForm').style.display = 'block';
          document.getElementById('userInfo').innerHTML = '';
          document.getElementById('postJob').style.display = 'none';
          document.getElementById('apply').style.display = 'none';
        }
      }

      function logout() {
        token = null;
        currentUser = null;
        localStorage.removeItem('ss_token');
        localStorage.removeItem('ss_user');
        updateUI();
        showAlert('Logged out successfully', 'info');
      }

      async function handleRegister() {
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const role = document.getElementById('role').value;

        if (!name || !email || !password) {
          showAlert('Please fill all fields', 'error');
          return;
        }

        try {
          const res = await fetch(API + '/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password, role })
          });
          const data = await res.json();

          if (data.token) {
            token = data.token;
            currentUser = data.user;
            localStorage.setItem('ss_token', token);
            localStorage.setItem('ss_user', JSON.stringify(currentUser));
            updateUI();
            showAlert(`Welcome ${name}! Account created successfully.`, 'success');
            document.getElementById('password').value = '';
            if (socket && socket.connected) socket.emit('join', { role: currentUser.role, id: currentUser.id });
          } else {
            showAlert(data.error || 'Registration failed', 'error');
          }
        } catch (err) {
          showAlert('Network error: ' + err.message, 'error');
        }
      }

      async function handleLogin() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          showAlert('Please enter email and password', 'error');
          return;
        }

        try {
          const res = await fetch(API + '/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();

          if (data.token) {
            token = data.token;
            currentUser = data.user;
            localStorage.setItem('ss_token', token);
            localStorage.setItem('ss_user', JSON.stringify(currentUser));
            updateUI();
            showAlert(`Welcome back, ${currentUser.name}!`, 'success');
            document.getElementById('password').value = '';
            if (socket && socket.connected) socket.emit('join', { role: currentUser.role, id: currentUser.id });
          } else {
            showAlert(data.error || 'Login failed', 'error');
          }
        } catch (err) {
          showAlert('Network error: ' + err.message, 'error');
        }
      }

      async function handleCreateJob() {
        if (!currentUser || currentUser.role !== 'recruiter') {
          showAlert('Only recruiters can post jobs', 'error');
          return;
        }

        const title = document.getElementById('jobTitle').value.trim();
        const description = document.getElementById('jobDesc').value.trim();
        const requirements = document.getElementById('jobReq').value.trim();
        const tech_tags = document.getElementById('jobTags').value.split(',').map(s => s.trim()).filter(Boolean);

        if (!title) {
          showAlert('Job title is required', 'error');
          return;
        }

        try {
          const res = await fetch(API + '/jobs', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ title, description, requirements, tech_tags })
          });
          const data = await res.json();

          if (data.job) {
            showAlert('✅ Job posted successfully!', 'success');
            document.getElementById('jobTitle').value = '';
            document.getElementById('jobDesc').value = '';
            document.getElementById('jobReq').value = '';
            document.getElementById('jobTags').value = '';
            loadJobs();
          } else {
            showAlert(data.error || 'Could not post job', 'error');
          }
        } catch (err) {
          showAlert('Network error: ' + err.message, 'error');
        }
      }

      async function loadJobs() {
        try {
          const res = await fetch(API + '/jobs');
          const data = await res.json();
          allJobs = data.jobs || [];
          document.getElementById('jobCount').textContent = allJobs.length;

          const container = document.getElementById('jobs');
          if (allJobs.length === 0) {
            container.innerHTML = '<div class="no-jobs">No jobs available yet</div>';
            return;
          }

          container.innerHTML = '';
          allJobs.forEach(job => {
            const jobCard = document.createElement('div');
            jobCard.className = 'job-card';
            jobCard.innerHTML = `
              <b>${job.title}</b>
              <div class="job-desc">${job.description || 'No description provided'}</div>
              <div class="job-tags">
                ${job.tech_tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
              </div>
              <div style="margin-top: 12px;">
                <small style="color: #666;">Posted by ${job.recruiter_name}</small>
              </div>
              ${currentUser && currentUser.role === 'candidate' ? `
                <button class="btn-small btn-primary" style="margin-top: 10px; width: 100%;" onclick="openAppModal(${job.id})">
                  Apply Now
                </button>
              ` : currentUser && currentUser.role === 'recruiter' && currentUser.id == job.recruiter_id ? `
                <button class="btn-small btn-success" style="margin-top: 10px; width: 100%;" onclick="viewApplications(${job.id})">
                  👥 View Applications
                </button>
              ` : ''}
            `;
            container.appendChild(jobCard);
          });
        } catch (err) {
          showAlert('Failed to load jobs: ' + err.message, 'error');
        }
      }

      function openAppModal(jobId) {
        selectedJobId = jobId;
        document.getElementById('appModal').classList.add('active');
      }

      async function handleApplicationSubmit(e) {
        e.preventDefault();

        if (!selectedJobId) {
          showAlert('Job not selected', 'error');
          return;
        }

        const cover_letter = document.getElementById('appCoverLetter').value.trim();
        const projectsStr = document.getElementById('appProjects').value.trim();
        const tech_tags = document.getElementById('appTechTags').value.split(',').map(s => s.trim()).filter(Boolean);

        let projects = [];
        if (projectsStr) {
          try {
            projects = JSON.parse(projectsStr);
          } catch (e) {
            showAlert('Invalid project links JSON', 'error');
            return;
          }
        }

        if (!cover_letter) {
          showAlert('Cover letter is required', 'error');
          return;
        }

        try {
          const res = await fetch(API + '/applications', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ job_id: selectedJobId, cover_letter, projects, tech_tags })
          });
          const data = await res.json();

          if (data.application_id) {
            showAlert('✅ Application submitted successfully! The recruiter will be notified.', 'success');
            document.getElementById('appForm').reset();
            closeAppModal();
            
            // Send email notification to recruiter
            const job = allJobs.find(j => j.id == selectedJobId);
            if (job) {
              sendEmailNotification(job.recruiter_name, job.recruiter_id, job.title, currentUser.name);
            }
          } else {
            showAlert(data.error || 'Could not submit application', 'error');
          }
        } catch (err) {
          showAlert('Network error: ' + err.message, 'error');
        }
      }

      function sendEmailNotification(recruiterName, recruiterId, jobTitle, candidateName) {
        // Simulate email sending with alert
        const emailContent = `
          Hi ${recruiterName},
          
          You have a new application for the position: "${jobTitle}"
          
          Candidate: ${candidateName}
          
          Check your dashboard to review the application.
          
          Best regards,
          Skill Sphere
        `;
        
        // In production, this would be a real email via backend
        console.log('Email sent:', emailContent);
        showAlert(`📧 Email notification sent to recruiter: ${recruiterName}`, 'success');
      }

      async function viewApplications(jobId) {
        if (!currentUser || currentUser.role !== 'recruiter') return;

        try {
          const res = await fetch(API + '/applications/job/' + jobId, {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();
          const apps = data.applications || [];

          let content = `<h3>Applications for Job #${jobId}</h3>`;
          if (apps.length === 0) {
            content += '<p>No applications yet</p>';
          } else {
            content += `<p><strong>${apps.length} application(s)</strong></p>`;
            apps.forEach(app => {
              content += `
                <div style="border: 1px solid #ddd; padding: 12px; margin: 10px 0; border-radius: 6px;">
                  <b>${app.candidate_name}</b><br>
                  <small>Status: <strong>${app.status}</strong> | Score: ${app.score || 'N/A'}</small><br>
                  <p>${app.cover_letter}</p>
                  <button class="btn-small btn-success" onclick="scoreApplication(${app.id}, 85, 'shortlisted')">✓ Shortlist</button>
                  <button class="btn-small btn-danger" onclick="scoreApplication(${app.id}, 0, 'rejected')">✗ Reject</button>
                </div>
              `;
            });
          }

          document.getElementById('dashContent').innerHTML = content;
          document.getElementById('dashModal').classList.add('active');
        } catch (err) {
          showAlert('Failed to load applications: ' + err.message, 'error');
        }
      }

      async function scoreApplication(appId, score, status) {
        try {
          const res = await fetch(API + '/applications/' + appId + '/score', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ score, status })
          });
          const data = await res.json();
          showAlert(`Application ${status === 'shortlisted' ? 'shortlisted' : 'rejected'}!`, 'success');
          setTimeout(() => location.reload(), 1500);
        } catch (err) {
          showAlert('Failed to update application: ' + err.message, 'error');
        }
      }

      function closeAppModal() {
        document.getElementById('appModal').classList.remove('active');
        selectedJobId = null;
      }

      function closeDashModal() {
        document.getElementById('dashModal').classList.remove('active');
      }

      // Event listeners
      document.getElementById('register').addEventListener('click', handleRegister);
      document.getElementById('login').addEventListener('click', handleLogin);
      document.getElementById('createJob').addEventListener('click', handleCreateJob);
      document.getElementById('appForm').addEventListener('submit', handleApplicationSubmit);
      document.getElementById('closeAppModal').addEventListener('click', closeAppModal);
      document.getElementById('closeDashModal').addEventListener('click', closeDashModal);

      // Close modals on background click
      window.addEventListener('click', (e) => {
        if (e.target === document.getElementById('appModal')) closeAppModal();
        if (e.target === document.getElementById('dashModal')) closeDashModal();
      });

      // Initialize
      updateUI();
      loadJobs();

      // Socket events
      if (socket) {
        socket.on('connect', () => {
          console.log('socket connected', socket.id);
          if (currentUser) socket.emit('join', { role: currentUser.role, id: currentUser.id });
        });

        socket.on('jobCreated', (data) => {
          showAlert('🆕 New job posted: ' + (data.job.title || ''), 'info');
          // Add new job to UI by refreshing list
          loadJobs();
        });

        socket.on('applicationSubmitted', (payload) => {
          showAlert('📥 New application from: ' + (payload.candidate_name || ''), 'info');
          // Recruiter may refresh applications view when needed
        });
      }
    </script>
  </body>
</html>
